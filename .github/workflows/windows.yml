name: Windows preview
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'core/**'
      - 'core-checks/**'
      - 'tests/**'
      - 'tools/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-preview
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/main' && github.repository == 'Aetton/neowizardry'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Protect originals from checkout replacement
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'wiz_data')) {
            throw 'Move wiz_data outside the checkout to the runner _work directory before continuing. Checkout archive fallback can replace the whole checkout even with clean=false.'
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Bootstrap persistent self-hosted tools
        if: runner.environment == 'self-hosted'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./tools/windows/BootstrapHost.ps1
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Locate installed .NET 8 SDK and tool paths
        id: sdk
        run: |
          $versions = @()
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
            $versions = @(dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } | Where-Object { $_ -match '^8\.' })
          }
          "available=$($versions.Count -gt 0)" >> $env:GITHUB_OUTPUT
          "NEO_TOOL_ROOT=$env:LOCALAPPDATA/NeoWizardryBuildTools/godot-4.5.1-v1" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        if: steps.sdk.outputs.available != 'True'
        with:
          dotnet-version: '8.0.x'
      - name: Select installed .NET 8
        run: |
          $sdk = dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } | Where-Object { $_ -match '^8\.' } | Sort-Object { [version]$_ } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'No .NET 8 SDK available' }
          @{sdk=@{version=$sdk;rollForward='latestPatch'}} | ConvertTo-Json -Depth 3 | Set-Content global.json
          Write-Host "Using installed SDK $sdk"
      - name: Cache NuGet packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: Windows-neowizardry-nuget-net8-${{ hashFiles('**/*.csproj') }}
          restore-keys: Windows-neowizardry-nuget-net8-
      - name: Cache Godot editor and selected templates
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ env.NEO_TOOL_ROOT }}
          key: Windows-neowizardry-godot-mono-4.5.1-v1
      - name: Prepare retained Godot tools
        run: ./tools/windows/PrepareGodot.ps1 -ToolsRoot $env:NEO_TOOL_ROOT
      - name: Verify gameplay and updater
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project core-checks -- --fixture client/demo-items.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows/TestUpdater.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows client
        timeout-minutes: 3
        run: |
          dotnet build client/NeoWizardry.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Import Godot resources
        timeout-minutes: 2
        run: |
          & $env:GODOT --headless --editor --path client --import
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Export Windows game
        timeout-minutes: 3
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          & $env:GODOT --headless --path client --export-debug Windows ../build/windows/NeoWizardry.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Get-ChildItem build/windows -Recurse -Filter coreclr.dll)) { throw 'Bundled .NET runtime is missing' }
      - name: Run exported Windows smoke checks
        timeout-minutes: 3
        run: |
          foreach ($mode in @('--smoke', '--mobile-smoke')) {
            $process = Start-Process -FilePath "$PWD/build/windows/NeoWizardry.exe" -ArgumentList "--headless -- --touch $mode" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/$mode.log" -RedirectStandardError "$env:RUNNER_TEMP/$mode-error.log"
            $completed = $false
            try {
              $completed = $process.WaitForExit(60000)
              if (!$completed) { $process.Kill($true); $process.WaitForExit(5000) | Out-Null }
            } finally {
              Get-Content "$env:RUNNER_TEMP/$mode.log" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP/$mode-error.log" -ErrorAction SilentlyContinue
            }
            if (!$completed) { throw "Windows $mode timed out" }
            if ($process.ExitCode -ne 0) { throw "Windows $mode failed ($($process.ExitCode))" }
            if (!(Select-String -Path "$env:RUNNER_TEMP/$mode.log" -Pattern 'PASS:')) { throw "Missing $mode success marker" }
          }
      - name: Include local original-data importer and portable Python
        run: |
          if (Test-Path build/windows/importer) { Remove-Item build/windows/importer -Recurse -Force }
          New-Item -ItemType Directory -Force build/windows/importer | Out-Null
          Copy-Item tools build/windows/importer/tools -Recurse
          Get-ChildItem build/windows/importer/tools -Directory -Filter __pycache__ -Recurse | Remove-Item -Recurse -Force
          Copy-Item "$env:LOCALAPPDATA/NeoWizardryBuildTools/python-3.12.10" build/windows/importer/python -Recurse
          if (!(Test-Path build/windows/importer/python/python.exe)) { throw 'Bundled importer runtime missing' }
          & build/windows/importer/python/python.exe -c "import sys; sys.path.insert(0, 'build/windows/importer'); import tools.prepare_game"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify stair walking in packaged EXE
        run: |
          $env:NEO_WALKER_SMOKE='1'
          try {
            $start=Start-Process -FilePath "$PWD/build/windows/NeoWizardry.exe" -ArgumentList '--headless' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/walker.log" -RedirectStandardError "$env:RUNNER_TEMP/walker-error.log"
            if (!$start.WaitForExit(60000)) { $start.Kill(); throw 'Stair walking timed out' }
            Get-Content "$env:RUNNER_TEMP/walker.log"
            Get-Content "$env:RUNNER_TEMP/walker-error.log"
            if ($start.ExitCode -ne 0 -or !(Select-String -Path "$env:RUNNER_TEMP/walker.log" -Pattern 'PASS: stair walking')) { throw 'Stair walking failed' }
          } finally { Remove-Item Env:NEO_WALKER_SMOKE }
      - name: Verify folder picker confirmation in packaged EXE
        run: |
          $env:NEO_PICKER_SMOKE='1'
          try {
            $start=Start-Process -FilePath "$PWD/build/windows/NeoWizardry.exe" -ArgumentList '--headless' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/picker.log" -RedirectStandardError "$env:RUNNER_TEMP/picker-error.log"
            if (!$start.WaitForExit(60000)) { $start.Kill(); throw 'Folder picker timed out' }
            Get-Content "$env:RUNNER_TEMP/picker.log"
            Get-Content "$env:RUNNER_TEMP/picker-error.log"
            if ($start.ExitCode -ne 0 -or !(Select-String -Path "$env:RUNNER_TEMP/picker.log" -Pattern 'PASS: folder picker confirmation')) { throw 'Folder confirmation is inaccessible' }
          } finally { Remove-Item Env:NEO_PICKER_SMOKE }
      - name: Verify ordinary exported startup without developer flags
        run: |
          $env:NEO_STARTUP_SMOKE='1'
          $env:NEO_WORLD_CACHE=''
          $start = Start-Process -FilePath "$PWD/build/windows/NeoWizardry.exe" -ArgumentList '--headless' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/default-start.log" -RedirectStandardError "$env:RUNNER_TEMP/default-start-error.log"
          if (!$start.WaitForExit(60000)) { $start.Kill(); throw 'Ordinary startup timed out' }
          Get-Content "$env:RUNNER_TEMP/default-start.log"
          if ($start.ExitCode -ne 0 -or !(Select-String -Path "$env:RUNNER_TEMP/default-start.log" -Pattern 'PASS: ordinary startup')) { throw 'Ordinary startup did not open setup' }
          Remove-Item Env:NEO_STARTUP_SMOKE
      - name: Verify ordinary player startup in the packaged Windows EXE
        env:
          WIZ8_INSTALLATION: ${{ vars.WIZ8_ROOT }}
        run: |
          ./tools/windows/FindOriginal.ps1
          $installation=Split-Path (Split-Path ((Get-Content $env:GITHUB_ENV | Where-Object { $_ -like 'NEO_LEVELS_ARCHIVE=*' } | Select-Object -Last 1) -replace '^NEO_LEVELS_ARCHIVE=','') -Parent) -Parent
          $world=Join-Path (Split-Path $installation -Parent) 'NeoWizardryWorld'
          $levels=Join-Path $installation 'Levels/LEVELS.SLF'
          python -m tools.world_props "$levels" --out "$world" --report "$env:RUNNER_TEMP/player-props.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.level_status "$levels" --out "$world"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NEO_NATIVE_ENCOUNTER_SMOKE='1'
          $env:NEO_WORLD_CACHE=$world
          $env:NEO_STARTUP_SMOKE='1'
          $start=Start-Process -FilePath "$PWD/build/windows/NeoWizardry.exe" -ArgumentList '--headless' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/player-start.log" -RedirectStandardError "$env:RUNNER_TEMP/player-start-error.log"
          if (!$start.WaitForExit(120000)) { $start.Kill(); throw 'Packaged monastery startup timed out' }
          Get-Content "$env:RUNNER_TEMP/player-start.log"
          Get-Content "$env:RUNNER_TEMP/player-start-error.log"
          if ($start.ExitCode -ne 0 -or !(Select-String -Path "$env:RUNNER_TEMP/player-start.log" -Pattern 'PASS: native STS group')) { throw 'Packaged game did not enter monastery by default' }
          Remove-Item Env:NEO_WORLD_CACHE,Env:NEO_STARTUP_SMOKE,Env:NEO_NATIVE_ENCOUNTER_SMOKE
      - name: Package game and launcher
        run: |
          $tag = "windows-build-$env:GITHUB_RUN_NUMBER"
          "PREVIEW_TAG=$tag" >> $env:GITHUB_ENV
          Compress-Archive -Path build/windows/* -DestinationPath build/neowizardry-windows-x64.zip
          @{schema=1;version=$tag;commit=$env:GITHUB_SHA;sha256=(Get-FileHash build/neowizardry-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content -Encoding utf8 build/build.json
          Copy-Item tools/windows/RunNeoWizardry.cmd,tools/windows/UpdateAndRun.ps1 build/
          Compress-Archive -Path build/RunNeoWizardry.cmd,build/UpdateAndRun.ps1 -DestinationPath build/neowizardry-windows-launcher.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neowizardry-windows-preview
          path: |
            build/neowizardry-windows-x64.zip
            build/neowizardry-windows-launcher.zip
            build/build.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish completed preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Aetton/neowizardry
        run: |
          $known = @(gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json | Where-Object tagName -eq $env:PREVIEW_TAG)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($known.Count -gt 0) {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:PREVIEW_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ($release.target_commitish -ne $env:GITHUB_SHA -or $release.draft) { throw 'Existing preview does not match this completed source commit' }
            Write-Host 'Re-run: keeping the previously published immutable preview.'
          } else {
            # GitHub's release endpoint requires workflow-write permission when the
            # target differs from main in workflow files; GITHUB_TOKEN cannot get it.
            # Keep the artifact's recorded source instead of silently tagging main.
            $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/${env:GITHUB_SHA}...main" | ConvertFrom-Json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $changedWorkflows = @($comparison.files | Where-Object { $_.filename -like '.github/workflows/*' })
            if ($changedWorkflows.Count -gt 0) {
              throw 'Workflow files changed on main during this build. Build current main before publishing; the artifact remains available at this run.'
            }
            gh release create $env:PREVIEW_TAG --target $env:GITHUB_SHA --prerelease --draft --title "Windows preview $env:GITHUB_RUN_NUMBER" --notes "Portable Windows x64 test build. Download the launcher once; it checks published previews and preserves app-local saves. Original game data is excluded."
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release upload $env:PREVIEW_TAG build/neowizardry-windows-x64.zip build/neowizardry-windows-launcher.zip build/build.json --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $env:PREVIEW_TAG --draft=false
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify the published launcher's first download
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP/neo-launcher-live-test"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows/UpdateAndRun.ps1 -NoLaunch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows/UpdateAndRun.ps1 -NoLaunch -Offline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
