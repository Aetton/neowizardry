name: Verify technical slice
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: Linux-neowizardry-nuget-net8-${{ hashFiles('**/*.csproj') }}
          restore-keys: Linux-neowizardry-nuget-net8-
      - uses: actions/cache@v4
        id: godot
        with:
          path: ~/.cache/neowizardry/godot-4.5.1
          key: Linux-neowizardry-godot-mono-4.5.1-v1
      - run: python -m unittest discover -s tests -v
      - run: dotnet run --project core-checks -- --fixture "$RUNNER_TEMP/neo-test-items.json"
      - run: dotnet build client/NeoWizardry.csproj
      - name: Get Godot .NET and smoke test
        shell: bash
        run: |
          godot_root="$HOME/.cache/neowizardry/godot-4.5.1"
          if [ ! -f "$godot_root/Godot_v4.5.1-stable_mono_linux_x86_64/Godot_v4.5.1-stable_mono_linux.x86_64" ]; then
            mkdir -p "$godot_root"
            curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
            unzip -q /tmp/godot.zip -d "$godot_root"
          fi
          executable="$godot_root/Godot_v4.5.1-stable_mono_linux_x86_64/Godot_v4.5.1-stable_mono_linux.x86_64"
          chmod +x "$executable"
          timeout 60s "$executable" --headless --path client -- --smoke --catalog "$RUNNER_TEMP/neo-test-items.json" --spells "$RUNNER_TEMP/neo-test-items.spells.json" --recipes "$RUNNER_TEMP/neo-test-items.recipes.json"
          timeout 60s "$executable" --headless --path client -- --touch --mobile-smoke --catalog "$RUNNER_TEMP/neo-test-items.json" --spells "$RUNNER_TEMP/neo-test-items.spells.json" --recipes "$RUNNER_TEMP/neo-test-items.recipes.json"
          python tests/world_fixture.py "$RUNNER_TEMP/world-fixture"
          timeout 60s "$executable" --headless --path client -- --world "$RUNNER_TEMP/world-fixture/fixture.glb" --world-smoke --world-collision-smoke --world-triangles 2 --world-colliders 2 --world-objects 1 --world-arrivals 1 --world-doors 1 --world-door-models 1 --world-door-frames 2 --world-door-triangles 2 --world-door-interactive 1 --world-expedition-smoke
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"world-fixture/fixture.nwdoors.glb"; p.write_bytes(p.read_bytes()+b"tampered")'
          if timeout 60s "$executable" --headless --path client -- --world "$RUNNER_TEMP/world-fixture/fixture.glb" --world-smoke > "$RUNNER_TEMP/door-invalid.log" 2>&1; then
            echo 'Invalid door geometry was accepted'; exit 1
          fi
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"door-invalid.log"; assert "Door frame GLB hash mismatch" in p.read_text(), p.read_text()'
          python tests/world_fixture.py "$RUNNER_TEMP/world-fixture"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"world-fixture/fixture.nwobjects.json"; v=json.loads(p.read_text()); v["pvl_sha256"]="0"*64; p.write_text(json.dumps(v))'
          if timeout 60s "$executable" --headless --path client -- --world "$RUNNER_TEMP/world-fixture/fixture.glb" --world-smoke > "$RUNNER_TEMP/world-invalid.log" 2>&1; then
            echo 'Invalid object provenance was accepted'; exit 1
          fi
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"world-invalid.log"; assert "Object sidecar schema/provenance mismatch" in p.read_text(), p.read_text()'
