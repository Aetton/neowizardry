name: Original monastery resource audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-audit.yml'
      - 'tools/world_audit.py'
      - 'tools/pvl.py'
      - 'tools/textures.py'
      - 'tools/oct.py'
      - 'tools/world_objects.py'
      - 'tools/world_doors.py'
      - 'client/WorldPreview.cs'
      - 'client/WorldCollision.cs'
      - 'client/WorldObjects.cs'
      - 'client/WorldDoors.cs'
      - 'client/WorldExpeditionView.cs'
      - 'client/WorldCreature.cs'
      - 'client/CreatureGallery.cs'
      - 'tools/creatures.py'
      - 'tests/test_creatures.py'
      - 'core/WorldExpedition.cs'
      - 'core/ExpeditionRewards.cs'
      - 'tools/windows/TestWorld.ps1'
      - 'tools/windows/FindOriginal.ps1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-world-audit
  cancel-in-progress: false
jobs:
  monastery:
    if: github.ref == 'refs/heads/main' && github.repository == 'Aetton/neowizardry'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Protect originals from checkout replacement
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'wiz_data')) {
            throw 'Move wiz_data outside the checkout to the runner _work directory before continuing. Checkout archive fallback can replace the whole checkout even with clean=false.'
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Bootstrap retained tools
        run: ./tools/windows/BootstrapHost.ps1
      - name: Locate installed original
        env:
          WIZ8_INSTALLATION: ${{ vars.WIZ8_ROOT }}
        run: ./tools/windows/FindOriginal.ps1
      - name: Verify exporter with synthetic archives
        run: |
          python -m unittest discover -s tests -p test_world_audit.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Inspect original archive without publishing resources
        run: |
          Remove-Item "$env:RUNNER_TEMP/monastery-report.json","$env:RUNNER_TEMP/monastery-geometry.json" -ErrorAction SilentlyContinue
          python -m tools.world_audit "$env:NEO_LEVELS_ARCHIVE" --out "$env:RUNNER_TEMP/monastery-report.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Export private static monastery geometry
        run: |
          $dataRoot = Split-Path (Split-Path (Split-Path $env:NEO_LEVELS_ARCHIVE -Parent) -Parent) -Parent
          $worldRoot = Join-Path $dataRoot 'NeoWizardryWorld'
          python -m tools.pvl "$env:NEO_LEVELS_ARCHIVE" --out "$worldRoot" --report "$env:RUNNER_TEMP/monastery-geometry.json" --textures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "NEO_WORLD_CACHE=$worldRoot" >> $env:GITHUB_ENV
      - name: Read original processed collision surfaces
        run: |
          Remove-Item "$env:RUNNER_TEMP/monastery-collision.json" -ErrorAction SilentlyContinue
          python -m tools.oct "$env:NEO_LEVELS_ARCHIVE" --out "$env:NEO_WORLD_CACHE" --report "$env:RUNNER_TEMP/monastery-collision.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Read native objects and triggers without publishing records
        run: |
          python -m unittest discover -s tests -p test_world_objects.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.world_objects "$env:NEO_LEVELS_ARCHIVE" --out "$env:NEO_WORLD_CACHE" --report "$env:RUNNER_TEMP/monastery-objects.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Export private native door frames
        run: |
          python -m unittest discover -s tests -p test_world_doors.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.world_doors "$env:NEO_LEVELS_ARCHIVE" --out "$env:NEO_WORLD_CACHE" --report "$env:RUNNER_TEMP/monastery-doors.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare retained Godot tools
        run: ./tools/windows/PrepareGodot.ps1 -ToolsRoot "$env:LOCALAPPDATA/NeoWizardryBuildTools/godot-4.5.1-v1"
      - name: Compile private expedition catalogs
        run: |
          $installation = Split-Path (Split-Path $env:NEO_LEVELS_ARCHIVE -Parent) -Parent
          $data = Join-Path $installation 'Data/DATA.SLF'
          $overlay = @('--loose-dir', (Join-Path $installation 'Data'))
          Get-ChildItem (Join-Path $installation 'Patches') -Filter 'PATCH.*' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^PATCH\.\d+$' } | ForEach-Object { $overlay += @('--patch', $_.FullName) }
          python -m tools.slf items "$data" @overlay --out "$env:NEO_WORLD_CACHE/items.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.slf monsters "$data" @overlay --out "$env:NEO_WORLD_CACHE/monsters.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Export all private creature models
        run: |
          $installation = Split-Path (Split-Path $env:NEO_LEVELS_ARCHIVE -Parent) -Parent
          $data = Join-Path $installation 'Data/DATA.SLF'
          $monsters = Join-Path $installation 'Data/Monsters/MONSTERS.SLF'
          $overlay = @('--loose-dir', (Join-Path $installation 'Data'))
          Get-ChildItem (Join-Path $installation 'Patches') -Filter 'PATCH.*' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^PATCH\.\d+$' } | ForEach-Object { $overlay += @('--patch', $_.FullName) }
          python -m tools.creatures "$data" "$monsters" @overlay --all --out "$env:NEO_WORLD_CACHE" --report "$env:RUNNER_TEMP/monastery-creatures-all.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and verify original geometry in Godot
        run: |
          dotnet build client/NeoWizardry.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:GODOT --headless --editor --path client --import
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/windows/TestWorld.ps1 -WorldRoot "$env:NEO_WORLD_CACHE" -Report "$env:RUNNER_TEMP/monastery-geometry.json" -CollisionReport "$env:RUNNER_TEMP/monastery-collision.json" -ObjectsReport "$env:RUNNER_TEMP/monastery-objects.json" -DoorsReport "$env:RUNNER_TEMP/monastery-doors.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify every exported creature in Godot
        run: |
          & $env:GODOT --headless --path client -- --creatures "$env:NEO_WORLD_CACHE/creatures-index.json" --creatures-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monastery-resource-report
          path: |
            ${{ runner.temp }}/monastery-report.json
            ${{ runner.temp }}/monastery-geometry.json
            ${{ runner.temp }}/monastery-collision.json
            ${{ runner.temp }}/monastery-objects.json
            ${{ runner.temp }}/monastery-doors.json
            ${{ runner.temp }}/monastery-creatures-all.json
          if-no-files-found: ignore
          retention-days: 7
